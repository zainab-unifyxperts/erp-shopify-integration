[project]
name = "shopify_integration"
authors = [
    { name = "manan", email = "manan@unifyxperts.com"}
]
description = "Shopify Integration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "ShopifyAPI==12.7.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"

